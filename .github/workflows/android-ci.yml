name: Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: limingjie-assistant-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable test release APK
        uses: actions/upload-artifact@v4
        with:
          name: limingjie-assistant-test-release
          path: android/app/build/outputs/apk/release/app-release.apk

